<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <title>Kitchen Login - Cafe BE</title>

  <link rel="stylesheet" href="../css/receptionist-login.css">

  <!-- 🔥 FONT AWESOME -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <script defer src="../js/cook-login.js"></script>

</head>

<body>

<div class="login-page">

  <div class="login-box">

    <h1>👨‍🍳 Kitchen Portal</h1>

    <h2>Login</h2>

    <form id="cook-login-form">

      <input
        type="email"
        id="email"
        placeholder="Email"
        required
      >

      <!-- 🔥 PASSWORD -->
      <div class="password-box">

        <input
          type="password"
          id="password"
          placeholder="Password"
          required
        >

        <i class="fa-solid fa-eye toggle-password"
           data-target="password"></i>

      </div>

      <button type="submit">
        Login
      </button>

    </form>

    <p id="error-msg" class="error-msg"></p>

  </div>

</div>

</body>
</html>
