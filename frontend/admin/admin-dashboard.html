<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - Cafe BE</title>

  <link rel="stylesheet" href="../css/admin-dashboard.css">

  <script defer src="../js/admin-dashboard.js"></script>
  <script defer src="../js/admin-auth.js"></script>
</head>

<body>

<div class="dashboard-container">

  <!-- Sidebar -->
  <aside class="dashboard-sidebar">

    <h2>☕ Cafe BE</h2>

    <p class="panel-title">Admin Panel</p>

    <nav>
      <a href="admin-dashboard.html" class="active">Dashboard</a>
      <a href="manage-menu.html">Manage Menu</a>
      <a href="admin-orders.html">Orders</a>
      <a href="#" id="logout-btn">Logout</a>
    </nav>

  </aside>

  <!-- Main -->
  <main class="dashboard-main">

    <h1>Admin Overview</h1>

    <div class="stats-grid">

      <div class="stat-card">
        <h3>Total Orders</h3>
        <p id="total-orders">0</p>
      </div>

      <div class="stat-card">
        <h3>Total Revenue</h3>
        <p>₹<span id="total-revenue">0</span></p>
      </div>

      <div class="stat-card">
        <h3>Menu Items</h3>
        <p id="menu-count">0</p>
      </div>

      <div class="stat-card">
        <h3>Avg Order Value</h3>
        <p>₹<span id="avg-order-value">0</span></p>
      </div>

    </div>

    <!-- ANALYTICS -->

    <div class="analytics-section">

      <h2>Date Analytics</h2>

      <div class="filter-box">

        <input type="date" id="analytics-date">

        <button id="load-analytics-btn">
          View Analytics
        </button>

      </div>

      <div class="analytics-grid">

        <div class="stat-card">
          <h3>Orders</h3>
          <p id="date-orders">0</p>
        </div>

        <div class="stat-card">
          <h3>Revenue</h3>
          <p>₹<span id="date-revenue">0</span></p>
        </div>

        <div class="stat-card">
          <h3>Completed Orders</h3>
          <p id="date-completed">0</p>
        </div>

        <div class="stat-card">
          <h3>Active Orders</h3>
          <p id="date-active">0</p>
        </div>

      </div>

    </div>

  </main>

</div>

</body>
</html>
