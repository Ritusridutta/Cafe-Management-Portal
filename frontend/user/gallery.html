<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery - Cafe Management</title>
  <link rel="stylesheet" href="../css/stylex.css">
  <script defer src="../js/user-auth.js"></script>
</head>

<body>
  <div class="container">

    <aside class="sidebar">
      <div class="logo">
        <img src="../img/logo.png">
        <h2>CAFE BE</h2>
        <p>Original Taste<br>Est. 2023</p>
      </div>

      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="gallery.html" class="active">Gallery</a>
        <a href="menu.html">Menu</a>
        <a href="cart.html">Cart</a>
        <a href="contact.html">Contact</a>
      </nav>

    </aside>

    <!-- MAIN -->
    <main class="main-content gallery">

      <header class="gallery-header">
        <h1>A Look Inside</h1>
        <p>Step into our world of delightful flavors and cozy vibes.</p>
      </header>

      <section class="gallery-grid">
        <div class="gallery-item"><img src="../img/gallery-1.jpg"></div>
        <div class="gallery-item"><img src="../img/gallery-2.jpg"></div>
        <div class="gallery-item"><img src="../img/gallery-3.jpg"></div>
        <div class="gallery-item"><img src="../img/gallery-4.jpg"></div>
        <div class="gallery-item"><img src="../img/gallery-5.jpg"></div>
        <div class="gallery-item"><img src="../img/gallery-6.jpg"></div>
        <div class="gallery-item"><img src="../img/gallery-7.jpg"></div>
        <div class="gallery-item"><img src="../img/gallery-8.jpg"></div>
        <div class="gallery-item"><img src="../img/gallery-9.jpg"></div>
        <div class="gallery-item"><img src="../img/gallery-10.jpg"></div>
        <div class="gallery-item"><img src="../img/gallery-11.jpg"></div>
        <div class="gallery-item"><img src="../img/gallery-12.jpg"></div>
      </section>

      <footer class="gallery-footer">
        <div class="hours">
          <h3>Hours of Operation</h3>
          <p>Mon - Sun: 8am - 9pm</p>
        </div>

        <div class="newsletter">
          <h3>Join Our Newsletter</h3>
          <form>
            <input type="text" placeholder="First Name" required>
            <input type="text" placeholder="Last Name" required>
            <input type="email" placeholder="Your Email" required>
            <button type="submit">Subscribe</button>
          </form>
        </div>
      </footer>

    </main>
  </div>
</body>
</html>
