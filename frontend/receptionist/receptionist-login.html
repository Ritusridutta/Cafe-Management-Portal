<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <title>Receptionist Login - Cafe BE</title>

  <link rel="stylesheet" href="../css/receptionist-login.css">

  <!-- FONT AWESOME -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <script defer src="../js/receptionist-login.js"></script>

</head>

<body>

  <div class="login-page">

    <div class="login-box">

      <h1>☕ Cafe BE</h1>

      <h2>Receptionist Portal</h2>

      <form id="login-form">

        <input
          type="email"
          id="email"
          placeholder="Email Address"
          required
        >

        <!-- PASSWORD -->
        <div class="password-box">

          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          >

          <i class="fa-solid fa-eye toggle-password"
             data-target="password"></i>

        </div>

        <button type="submit">
          Login
        </button>

      </form>

      <p id="error-msg" class="error-msg"></p>

    </div>

  </div>

</body>
</html>
